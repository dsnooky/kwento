```html
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PAGZ Credit Cooperative | Financial Security & Memorial Care</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
scroll-behavior:smooth;
}

:root{
--primary:#0d5c2b;
--secondary:#D4AF37;
--white:#fff;
--dark:#111827;
--light:#f5f7fa;
}

body{
background:
radial-gradient(circle at top left,#dff5e5 0%,transparent 35%),
radial-gradient(circle at bottom right,#f8edc4 0%,transparent 35%),
linear-gradient(135deg,#f5f7fa,#ffffff);
color:#333;
overflow-x:hidden;
}

/* NAVBAR */

header{
position:fixed;
width:100%;
top:0;
z-index:1000;
background:rgba(255,255,255,.95);
backdrop-filter:blur(10px);
box-shadow:0 2px 15px rgba(0,0,0,.08);
}

.navbar{
max-width:1200px;
margin:auto;
padding:15px 20px;
display:flex;
justify-content:space-between;
align-items:center;
}

.logo{
font-size:1.5rem;
font-weight:800;
color:var(--primary);
}

.logo span{
color:var(--secondary);
}

.nav-links{
display:flex;
gap:25px;
}

.nav-links a{
text-decoration:none;
color:#333;
font-weight:500;
transition:.3s;
}

.nav-links a:hover{
color:var(--primary);
}

.btn{
background:var(--primary);
color:#fff;
padding:12px 25px;
border-radius:50px;
text-decoration:none;
font-weight:600;
transition:.3s;
}

.btn:hover{
background:var(--secondary);
transform:translateY(-3px);
}

/* HERO */

.hero{
height:100vh;
background:
linear-gradient(rgba(0,0,0,.55),
rgba(0,0,0,.55)),
url('images/hero.jpg') center/cover;
display:flex;
align-items:center;
justify-content:center;
text-align:center;
color:white;
padding:20px;
}

.hero-content{
max-width:900px;
}

.hero h1{
font-size:4rem;
font-weight:800;
margin-bottom:20px;
}

.hero p{
font-size:1.2rem;
margin-bottom:30px;
}

.hero-buttons{
display:flex;
justify-content:center;
gap:20px;
flex-wrap:wrap;
}

.btn-secondary{
background:var(--secondary);
color:#111;
padding:12px 25px;
border-radius:50px;
text-decoration:none;
font-weight:700;
}

/* SECTIONS */

section{
padding:90px 8%;
}

.section-title{
text-align:center;
margin-bottom:50px;
}

.section-title h2{
font-size:2.5rem;
color:var(--primary);
}

.section-title p{
color:#666;
}

/* CARDS */

.stat-box,
.service-card,
.lot-card,
.contact-info,
.contact-form{
background:rgba(255,255,255,.95);
backdrop-filter:blur(10px);
border:1px solid rgba(255,255,255,.5);
box-shadow:0 10px 25px rgba(0,0,0,.08);
}

/* STATS */

.stats{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:25px;
}

.stat-box{
padding:35px;
text-align:center;
border-radius:15px;
}

.stat-box h3{
font-size:2.5rem;
color:var(--primary);
}

/* SERVICES */

.services-grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:30px;
}

.service-card{
padding:35px;
border-radius:20px;
transition:.3s;
}

.service-card:hover{
transform:translateY(-10px);
}

.service-card i{
font-size:40px;
color:var(--primary);
margin-bottom:20px;
}

/* ABOUT */

.about{
display:grid;
grid-template-columns:1fr 1fr;
gap:40px;
align-items:center;
}

.about img{
width:100%;
border-radius:20px;
}

.about h2{
color:var(--primary);
margin-bottom:20px;
}

/* GALLERY */

.gallery{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
gap:20px;
}

.gallery img{
width:100%;
height:280px;
object-fit:cover;
border-radius:15px;
transition:.3s;
}

.gallery img:hover{
transform:scale(1.05);
}

/* LOTS */

.lots{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
gap:30px;
}

.lot-card{
padding:30px;
border-radius:20px;
text-align:center;
}

.price{
font-size:2.5rem;
font-weight:800;
color:var(--secondary);
margin:20px 0;
}

/* CTA */

.cta{
background:
linear-gradient(rgba(13,92,43,.9),
rgba(13,92,43,.9)),
url('images/cta.jpg') center/cover;
text-align:center;
color:white;
}

.cta h2{
font-size:3rem;
margin-bottom:20px;
}

/* CONTACT */

.contact-grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:40px;
}

.contact-info,
.contact-form{
padding:30px;
border-radius:15px;
}

.contact-form input,
.contact-form textarea{
width:100%;
padding:15px;
margin-bottom:15px;
border:1px solid #ddd;
border-radius:10px;
}

.contact-form button{
width:100%;
padding:15px;
background:var(--primary);
border:none;
color:white;
font-weight:600;
border-radius:10px;
cursor:pointer;
}

/* FOOTER */

footer{
background:#111827;
color:white;
text-align:center;
padding:30px;
}

.socials{
margin-top:15px;
}

.socials a{
color:white;
margin:0 10px;
font-size:20px;
}

/* FLOATING BUTTONS */

.floating{
position:fixed;
right:20px;
bottom:20px;
display:flex;
flex-direction:column;
gap:15px;
z-index:999;
}

.float-btn{
width:60px;
height:60px;
border-radius:50%;
display:flex;
justify-content:center;
align-items:center;
color:white;
font-size:24px;
text-decoration:none;
box-shadow:0 5px 15px rgba(0,0,0,.25);
}

.messenger{
background:#0084ff;
}

.phone{
background:#0d5c2b;
}

@media(max-width:768px){

.hero h1{
font-size:2.5rem;
}

.about,
.contact-grid{
grid-template-columns:1fr;
}

.nav-links{
display:none;
}

}

</style>
</head>

<body>

</body>
</html>
```
